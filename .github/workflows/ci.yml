name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  kit-linux:
    name: BiathlonKit (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.4
    steps:
      - uses: actions/checkout@v7
      - run: swift test
        working-directory: Packages/BiathlonKit

  android:
    name: App (Android)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      # Gradle and jextract run on it, and swiftkit-core builds with it.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: ./.github/actions/swift-android-setup
      # swiftkit-core, the Java side of swift-java, is not on Maven Central: it is built from
      # the swift-java release that SwiftPM resolved, into the local Maven repository.
      - name: Publish swiftkit-core
        run: |
          swift package resolve --package-path swift
          version=$(jq -r '.pins[] | select(.identity == "swift-java") | .state.version' swift/Package.resolved)
          cd swift/.build/checkouts/swift-java
          ./gradlew :SwiftKitCore:publishToMavenLocal -PswiftkitVersion="$version"
      # A Gradle invocation builds either the debug or the release variants (kit/build.gradle.kts).
      - name: Build the release bundle
        run: ./gradlew :app:bundleRelease
      - name: Report the bundle size
        run: |
          bundle=app/build/outputs/bundle/release/app-release.aab
          {
            echo "### Android App Bundle"
            echo "$(du -h "$bundle" | cut -f1) in all; the native libraries, compressed:"
            echo '```'
            unzip -v "$bundle" 'base/lib/*'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The UI test runs on BiathlonKit's fictional World Cup, through the Swift library.
      - name: Test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/outputs/bundle
            android/app/build/reports

  format:
    name: Swift format
    runs-on: ubuntu-24.04
    container: swift:6.4
    steps:
      - uses: actions/checkout@v7
      - run: swift format lint --strict --recursive App Shared Widgets BiathlonTests BiathlonUITests Packages/BiathlonKit/Package.swift Packages/BiathlonKit/Sources Packages/BiathlonKit/Tests

  server:
    name: Server (Cloudflare Worker)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/server-setup
      - run: npm run check

  app-ios:
    name: App (iOS Simulator)
    # Xcode 27 (Swift 6.4), the version the app is developed with.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version && swift --version
      # The image's newest iPhone simulator, booted before the tests: left to xcodebuild, the
      # boot went on while the UI tests ran, and an app launch or the test runner's own start
      # could stall for minutes ("does not have a process ID", "Failed to terminate").
      # bootstatus -b boots the device and returns once its boot is complete.
      - name: Boot the simulator
        run: |
          device=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "device=$device" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$device" -b
      # The scheme's tests: the app's (BiathlonTests), hosted by the app, its UI tests
      # (BiathlonUITests), and BiathlonKit's.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Biathlon.xcodeproj \
            -scheme Biathlon \
            -destination "id=$device" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tee build.log
      # The concurrency and language settings come from Configs/*.xcconfig:
      # check that the compiler actually received them.
      - name: Check compiler settings
        run: |
          for feature in NonisolatedNonsendingByDefault InferIsolatedConformances ExistentialAny; do
            grep -rqs -- "$feature" build.log build/Build/Intermediates.noindex \
              || { echo "::error::$feature is not passed to the compiler"; exit 1; }
          done
      - name: Check privacy manifest
        run: test -f build/Build/Products/Debug-iphonesimulator/Biathlon.app/PrivacyInfo.xcprivacy
      # The Live Activities run in the widget extension, embedded in the app.
      - name: Check widget extension
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Biathlon.app
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$app/PlugIns/BiathlonWidgets.appex/Info.plist")" = com.apple.widgetkit-extension
          test "$(plutil -extract NSSupportsLiveActivities raw "$app/Info.plist")" = true
      # xcconfig files read // as a comment: check the server URL survived.
      - name: Check Info.plist
        run: |
          plist=build/Build/Products/Debug-iphonesimulator/Biathlon.app/Info.plist
          test "$(plutil -extract BiathlonServerURL raw "$plist")" = https://biathlon-server.fouteox.workers.dev
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = 1.0.0
