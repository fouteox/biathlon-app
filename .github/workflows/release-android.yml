name: Release Android

# Builds the Android app's release bundle each time main changes it, signed with the upload
# key, and sends it to Google Play's internal testing track with the store listings of
# android/play/listings: the counterpart of Xcode Cloud's TestFlight builds. The checks run
# again on that exact commit first.
#
# Skipped until the upload key is set up (the ANDROID_UPLOAD_KEY_ALIAS variable); sent to
# Google Play once the access is set up too (the GOOGLE_PLAY_SERVICE_ACCOUNT variable). Until
# then, the signed bundle is kept as the run's artifact, for its first upload by hand in the
# Play Console, which the API can't do. Steps in android/play/README.md.

on:
  push:
    branches: [main]
    paths:
      - android/**
      - Shared/Localizable.xcstrings
      - Configs/Project.xcconfig
      - Configs/Biathlon.xcconfig
      - .github/workflows/release-android.yml
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, each with its own version code, none cancelled halfway through.
concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: vars.ANDROID_UPLOAD_KEY_ALIAS != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Holds the upload key, which only main may use.
    environment: production
    permissions:
      contents: read
      # Google's short-lived credentials, through Workload Identity Federation, without a key.
      id-token: write
    defaults:
      run:
        working-directory: android
    env:
      BUNDLE: app/build/outputs/bundle/release/app-release.aab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore the upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: base64 --decode <<< "$KEYSTORE" > "$RUNNER_TEMP/upload.jks"
      # Each upload needs a higher version code than the last: this workflow's run number.
      - run: ./gradlew check :app:bundleRelease -PversionCode=${{ github.run_number }}
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: biathlon-${{ github.run_number }}
          path: android/${{ env.BUNDLE }}
      - id: google
        if: vars.GOOGLE_PLAY_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - if: vars.GOOGLE_PLAY_SERVICE_ACCOUNT != ''
        run: play/publish.sh "$BUNDLE"
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
