name: Set up server
description: Installs Node.js and the locked dependencies of the Cloudflare Worker in server/.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: server/package-lock.json
    - run: npm ci
      shell: bash
      working-directory: server
