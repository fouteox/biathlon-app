name: Set up Swift for Android
description: >-
  Installs the Swift toolchain with swiftly, the matching Swift SDK for Android and the
  Android NDK it links against, following swift.org's getting started guide.
inputs:
  swift-version:
    description: Swift toolchain version; the Swift SDK for Android must be the same release.
    default: 6.4.1
  swift-sdk-checksum:
    description: SHA-256 of the Swift SDK for Android, from swift.org/api/v1/install/releases.json.
    default: a356b79f8f1daa6ae3a66f4c556966ca20c0208b3659805cf30a83a0a31d6772
  ndk-package:
    description: The Android NDK's sdkmanager package (r30, the NDK swift.org documents).
    default: ndk;30.0.16248370
runs:
  using: composite
  steps:
    - name: Install swiftly and Swift
      shell: bash
      run: |
        set -euo pipefail
        # The toolchain's own system dependency, which swiftly checks for.
        sudo apt-get -q install -y libcurl4-openssl-dev
        # Outside the checkout: swiftly records the version in the current directory.
        cd "$RUNNER_TEMP"
        curl -fsSL --retry 3 -O "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
        tar -xzf "swiftly-$(uname -m).tar.gz"
        ./swiftly init --assume-yes --skip-install --no-modify-profile --quiet-shell-followup
        rm -f "swiftly-$(uname -m).tar.gz" swiftly
        echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
        "$HOME/.local/share/swiftly/bin/swiftly" install --use "${{ inputs.swift-version }}"
    - name: Install the Swift SDK for Android
      shell: bash
      run: |
        set -euo pipefail
        release="swift-${{ inputs.swift-version }}-RELEASE"
        swift sdk install \
          "https://download.swift.org/swift-${{ inputs.swift-version }}-release/android-sdk/${release}/${release}_android.artifactbundle.tar.gz" \
          --checksum "${{ inputs.swift-sdk-checksum }}"
    - name: Install the Android NDK and link the Swift SDK to it
      shell: bash
      run: |
        set -euo pipefail
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "${{ inputs.ndk-package }}" > /dev/null
        package="${{ inputs.ndk-package }}"
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${package#ndk;}"
        # Swift Build finds the NDK through this variable: the later build steps need it too.
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
        bundle="$(find "$HOME" -maxdepth 4 -type d -path "*/swift-sdks/swift-${{ inputs.swift-version }}-RELEASE_android.artifactbundle" | head -1)"
        test -n "$bundle"
        "$bundle/swift-android/scripts/setup-android-sdk.sh"
        swift sdk list
