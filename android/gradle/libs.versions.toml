[versions]
agp = "9.5.0"
kotlin = "2.4.21"
# Compose BOM 2026.09.00 requires compiling against API 37.
compileSdk = "37"
targetSdk = "37"
# java.time without desugaring.
minSdk = "26"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
# Lifecycle 2.9, which Activity 1.13 brings, ships lint checks that AGP 9.5's lint can no longer load.
lifecycle = "2.11.0"
junit = "4.13.2"
robolectric = "4.17"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
