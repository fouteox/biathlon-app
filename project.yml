# Xcode project generated by XcodeGen : `brew install xcodegen && xcodegen`
name: Biathlon
options:
  bundleIdPrefix: com.fouteox
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    # Swift 6 language mode: complete data-race checking is implied.
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    # String Catalogs: the compiler extracts localizable strings into App/Resources/Localizable.xcstrings.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set to the Apple Developer team ID
packages:
  BiathlonKit:
    path: Packages/BiathlonKit
targets:
  Biathlon:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: BiathlonKit
    entitlements:
      path: App/Resources/Biathlon.entitlements
      properties:
        # Xcode sets it from the provisioning profile: production for App Store and TestFlight builds.
        aps-environment: development
    info:
      path: App/Resources/Info.plist
      properties:
        # Cloudflare Worker base URL (see server/README.md); push alerts stay off while empty.
        BiathlonServerURL: https://biathlon-server.fouteox.workers.dev
        CFBundleDisplayName: Biathlon Live
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fouteox.biathlon
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Biathlon:
    build:
      targets:
        Biathlon: all
    test:
      targets:
        - package: BiathlonKit/BiathlonKitTests
